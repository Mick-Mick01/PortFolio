<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/Tricolour.png' ) }}">
    <title> | Uplaod Items</title>
    <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #0b5394;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 2rem;
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    h2 {
      color: #0b5394;
    }

    label {
      display: block;
      margin: 1rem 0 0.5rem;
      font-weight: bold;
    }

    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    .image-preview {
      margin-top: 1rem;
      max-width: 100%;
      height: auto;
      border: 1px solid #ccc;
      display: none;
    }

    .info-box {
      margin-top: 1rem;
      padding: 0.5rem;
      background-color: #e9ecef;
      border-left: 4px solid #0b5394;
    }

    footer {
      text-align: center;
      background-color: #0b5394;
      color: white;
      padding: 1rem;
      margin-top: 2rem;
      margin-bottom: 3.3rem;
    }

    .submit-btn {
      background-color: #0b5394;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 1rem;
    }

    .submit-btn:hover {
      background-color: #063769;
      align-self: center;
    }
  </style>
</head>
<body>
<header>
    <h1>Gigamart | VikshitBharat</h1>
    <p>Shop Registration Portal</p>
</header>

<main>
    <form action="/upload_item/{{shopId}}" id="itemForm" enctype="multipart/form-data" method="post">
        
        <div class="item-block">
            <label>Item Name</label>
            <input type="text" name="itemName[]" required>

            <label>Item Description</label>
            <input type="text" name="itemDescription[]" required>

            <label>Image</label>
            <button type="button" class="addImageBtn">+ Add Image</button>
            <span class="imageMessage" style="color: red; display: none;">Can't insert more than 7 images for each Item</span><br><br>
            <input type="file" name="itemImages0[]" class="imageInput" required> 

            <label>Video</label>
            <button type="button" class="addVideoBtn">+ Add Video</button>
            <span class="videoMessage" style="color: red; display: none;">Can't insert more than 2 videos for each Item</span><br><br>
            <input type="file" name="itemVideos0[]" class="videoInput" required>
        </div>

        <br>
        <button type="submit" class="submit-btn">Submit</button>
    </form>

    <br><br>
    <button type="button" class="submit-btn" id="addItemBtn">+ Add Item</button>
    <button onclick="preview()" class="submit-btn">Preview</button>
</main>

<footer>
    &copy; 2025 Gigamart | VikshitBharat Initiative
</footer>

<script>
let itemCount = 1; // tracks number of item blocks

// Setup add image/video for one block
function setupAddButtons(block, index) {
    let imageNumber = 1;
    let videoNumber = 1;

    const imageBtn = block.querySelector('.addImageBtn');
    const videoBtn = block.querySelector('.addVideoBtn');
    const imageMsg = block.querySelector('.imageMessage');
    const videoMsg = block.querySelector('.videoMessage');
    const imageInput = block.querySelector('.imageInput');
    const videoInput = block.querySelector('.videoInput');

    imageMsg.style.display = 'none';
    videoMsg.style.display = 'none';

    imageBtn.onclick = function() {
        if (imageNumber < 7) {
            const newImage = document.createElement('input');
            newImage.type = 'file';
            newImage.name = `itemImages${index}[]`;
            imageInput.insertAdjacentElement('afterend', document.createElement('br'));
            imageInput.insertAdjacentElement('afterend', newImage);
            imageNumber++;
        } else {
            imageBtn.style.display = 'none';
            imageMsg.style.display = 'block';
        }
    };

    videoBtn.onclick = function() {
        if (videoNumber < 2) {
            const newVideo = document.createElement('input');
            newVideo.type = 'file';
            newVideo.name = `itemVideos${index}[]`;
            videoInput.insertAdjacentElement('afterend', document.createElement('br'));
            videoInput.insertAdjacentElement('afterend', newVideo);
            videoNumber++;
        } else {
            videoBtn.style.display = 'none';
            videoMsg.style.display = 'block';
        }
    };
}

// Handle "+ Add Item" click
document.getElementById('addItemBtn').addEventListener('click', function() {
    const firstItem = document.querySelector('.item-block');
    const clone = firstItem.cloneNode(true);

    // Reset inputs
    clone.querySelectorAll('input').forEach(input => {
        input.value = '';
    });

    // Update names for this item’s files
    clone.querySelectorAll('.imageInput').forEach(input => {
        input.name = `itemImages${itemCount}[]`;
    });
    clone.querySelectorAll('.videoInput').forEach(input => {
        input.name = `itemVideos${itemCount}[]`;
    });

    // Rebind buttons for this block
    setupAddButtons(clone, itemCount);

    // Insert before submit button
    document.getElementById('itemForm').insertBefore(clone, document.querySelector('.submit-btn'));
    itemCount++;
});

// Initialize first block
setupAddButtons(document.querySelector('.item-block'), 0);
</script>
</body>

<script>
  function preview(){
    const imageInputs = document.querySelectorAll('input[name^="itemImages"]');
    const videoInputs = document.querySelectorAll('input[name^="itemVideos"]');

    const win = window.open("", "PreviewWindow", "width=800,height=600,scrollbars=yes");
    win.document.write("<html><head><title>Preview</title></head><body>");
    win.document.write("<h2>Images</h2>");

    imageInputs.forEach((input, inputIndex) => {
        if(input.files.length > 0){
            Array.from(input.files).forEach((file, fileIndex) => {
                const url = URL.createObjectURL(file);
                win.document.write(`
                    <div style="display:inline-block; margin:10px; text-align:center;">
                        <img src="${url}" style="max-width:200px; max-height:150px; border:1px solid #ccc;"><br>
                        <button onclick="opener.deleteFile('${inputIndex}', '${fileIndex}', 'image')">Delete</button>
                    </div>
                `);
            });
        }
    });

    win.document.write("<h2>Videos</h2>");
    videoInputs.forEach((input, inputIndex) => {
        if(input.files.length > 0){
            Array.from(input.files).forEach((file, fileIndex) => {
                const url = URL.createObjectURL(file);
                win.document.write(`
                    <div style="display:inline-block; margin:10px; text-align:center;">
                        <video src="${url}" controls style="max-width:300px; max-height:200px; border:1px solid #ccc;"></video><br>
                        <button onclick="opener.deleteFile('${inputIndex}', '${fileIndex}', 'video')">Delete</button>
                    </div>
                `);
            });
        }
    });

    win.document.write("</body></html>");
    win.document.close();
}

function deleteFile(inputIndex, fileIndex, type){
    let inputs = (type === 'image') 
        ? document.querySelectorAll('input[name^="itemImages"]')
        : document.querySelectorAll('input[name^="itemVideos"]');

    let input = inputs[inputIndex];

    // Convert FileList to Array so we can remove items
    let filesArray = Array.from(input.files);
    filesArray.splice(fileIndex, 1); // Remove selected file

    // Create a new DataTransfer to update input.files
    let dataTransfer = new DataTransfer();
    filesArray.forEach(file => dataTransfer.items.add(file));
    input.files = dataTransfer.files;

}
</script>
</html>
