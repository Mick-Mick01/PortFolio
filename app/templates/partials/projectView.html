<div class="portfolio-wrapper">
<div class="portfolio-container" id="portfolio">
    
{% for project in projects %}
<div class="project-card">
        <h3>{{ project.projectName }}</h3>
        <img src="{{ url_for( 'dashboard.get_Image', dataBase='PortFolio', collection=project.category, filename=project.imageName ) }}" class="project-video" alt="" content_type="project.imageType">
        <p class="project-description"> {{ project.discription }} </p>
        <button class="project-link" onclick="showExpand( '{{project.projectName}}' )">Expand</button>
</div>

<!-- We set the id of the Expand-View as the project name so that it can be called by JS using its ID without any conflict -->
         <div id="{{ project.projectName }}" style="display: none;"> 
                <button style="color: orange; margin-right: 20vw; cursor: pointer; background: grey;" class="project-link" onclick="closeExpand( '{{project.projectName}}' )">X Close</button>
                {{ project.HTMLcode | safe }}
         </div>
{% endfor %}

</div>
</div>

<script>
    function showExpand(project_name){
        document.getElementById(project_name).style.display = "block";
        document.getElementById(project_name).classList.add("Expand-card");
        document.body.classList.add(blurred);
    }
    function closeExpand(project_name){
        document.getElementById(project_name).style.display = "none";
        document.getElementById(project_name).classList.remove("Expand-card");
        document.body.classList.remove(blurred);
    }
</script>
