<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/Tricolour.png' ) }}">
    <title>Market Directory</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            font-family: 'Noto Sans', sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }
        header {
            background-color: #002366;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .org-logo {
            display: flex;
            align-items: center;
        }
        .org-logo img {
            height: 48px;
            margin-right: 12px;
        }
        .org-title {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .search-section {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            padding: 1.5rem;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .search-section h2 {
            text-align: center;
            color: #002366;
        }
        #searchInput {
            width: 100%;
            padding: 0.6rem;
            font-size: 1rem;
            border: 1px solid #aaa;
            border-radius: 5px;
            margin-bottom: 1rem;
        }
        .dropdown-list {
            border: 1px solid #ddd;
            max-height: 300px;
            overflow-y: auto;
            background: #fff;
            border-radius: 5px;
        }
        .dropdown-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        .dropdown-item:hover {
            background-color: #e8f0fe;
        }
        .market-name {
            font-weight: bold;
            color: #004080;
        }
        .market-address {
            font-size: 0.9rem;
            color: #555;
        }
        footer {
            background: #002366;
            color: white;
            text-align: center;
            padding: 1rem;
            margin-top: 2rem;
        }

        .market-form {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 80vh;
    text-align: center;
}

.market-select {
    width: 60%;
    max-width: 600px;
    padding: 1rem 1.5rem;
    font-size: 1.5rem;
    border: 2px solid #004aad;
    border-radius: 12px;
    background-color: #ffffff;
    color: #002366;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    transition: all 0.3s ease;  
}

.market-select:hover,
.market-select:focus {
    border-color: #001b6b;
    box-shadow: 0 10px 25px rgba(0, 64, 255, 0.2);
    outline: none;
}

.market-button {
    margin-top: 1.5rem;
    padding: 0.8rem 2rem;
    font-size: 1.2rem;
    font-weight: bold;
    background-color: #002366;
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background-color 0.3s ease, transform 0.2s ease;
}

.market-button:hover {
    background-color: #004aad;
    transform: scale(1.05);
}
.submit-btn {
      background-color: #0b5394;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 1rem;
    }

    .submit-btn:hover {
      background-color: #063769;
    }

    /* Responsive Design for screens smaller than 768px */

@media (max-width: 768px) {
    header {
        flex-direction: column;
        align-items: flex-start;
        padding: 1rem;
    }

    .org-title {
        font-size: 1.2rem;
        margin-top: 0.5rem;
    }

    .search-section {
        margin: 1rem;
        padding: 1rem;
    }

    .market-form {
        height: auto;
        padding: 1rem;
    }


    .market-button, .submit-btn {
        width: 50%;
        font-size: 1rem;
        padding: 0.7rem 1rem;
    }

    a[style] {
        float: none;
        display: block;
        margin: 1rem 0 0 0;
    }

    svg.w-6.h-6 {
        width: 24px;
        height: 24px;
    }
}
    </style>
</head>
<body style="margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden;">
   <header class="flex justify-between items-start p-4 bg-[#002366] shadow">

  <!-- Left: orgernment Logo and Title -->
  <div class="org-logo flex items-center gap-4">
    <img src="{{ url_for('static', filename='images/logo_1.png' ) }}" alt="Logo" style="border-radius: 50%;" class="h-12" />
    <div class="org-title text-white font-semibold leading-tight text-sm sm:text-base">
      Gigamart <br/>Market Directory
    </div>
  </div>

  <!-- Right: Clickable Item Page Icon -->
  <div class="text-center">
    <a href="/Gigamart/items_page" class="flex flex-col items-center text-white hover:text-gray-300 transition">
      <!-- White icon -->
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24">
        <rect x="3" y="4" width="18" height="16" rx="2" ry="2" stroke="white" stroke-width="2" />
        <path d="M3 10h18" stroke="white" stroke-width="2" />
        <circle cx="8" cy="7" r="1" fill="white"/>
        <rect x="10" y="6" width="7" height="2" fill="white"/>
      </svg>
      <span class="" style="color: #fff;">Search By Item</span>
    </a>
  </div>

</header>
<div style="
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  ">
<form action="/Gigamart/list" method="post">

<select name="marketName" id="marketName" class="market-select">
    <option value="New-Market">New Market</option>
    <option value="Ballygunge-Market">Ballygunge Market</option>
</select>
<button type="submit" class="submit-btn">Go To Market</button>
<a href="/Gigamart/upload_shop" style="float: right; margin-right: 10px;">uplaod a shop</a>

</form>
</div>

  <footer>
    &copy; 2025 Gigamart | VikshitBharat Initiative
  </footer>

</body>
</html>
