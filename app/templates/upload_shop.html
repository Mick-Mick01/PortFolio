<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/Tricolour.png' ) }}">
  <title> | Shop Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #0b5394;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 2rem;
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    h2 {
      color: #0b5394;
    }

    label {
      display: block;
      margin: 1rem 0 0.5rem;
      font-weight: bold;
    }

    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 0.5rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 3px;
    }

    .image-preview {
      margin-top: 1rem;
      max-width: 100%;
      height: auto;
      border: 1px solid #ccc;
      display: none;
    }

    .info-box {
      margin-top: 1rem;
      padding: 0.5rem;
      background-color: #e9ecef;
      border-left: 4px solid #0b5394;
    }

    footer {
      text-align: center;
      background-color: #0b5394;
      color: white;
      padding: 1rem;
      margin-top: 2rem;
    }

    .submit-btn {
      background-color: #0b5394;
      color: white;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      font-size: 1rem;
    }

    .submit-btn:hover {
      background-color: #063769;
    }
  </style>
</head>
<body>
  <header>
    <h1>Gigamart | VikshitBharat</h1>
    <p>Shop Registration Portal</p>
  </header>

  <main>
    <h2>Register Your Shop</h2>
    <form id="shopForm" action="/Gigamart/upload_shop" method="post" enctype="multipart/form-data">
      <label for="shopName">Shop Name</label>
      <input type="text" id="shopName" name="shopName" required>

      <label for="ownerName">Owner's Name</label>
      <input type="text" id="ownerName" name="ownerName" required>

      <label for="stallNumber">Stall Number</label>
      <input type="text" id="stallNumber" name="stallNumber" required>

      <label for="mobile">Mobile No.</label>
      <input type="number" id="mobile" name="mobile" required>

      <label for="openHours">Open Hours</label>
      <input type="text" id="openHours" name="openHours" placeholder="e.g. 9AM–8PM" required>

      <!-- First image: Shop Image -->
      <label for="shopImage">Shop Image</label>
      <input type="file" name="shopImage" id="shopImage" accept="image/*" required>

      <div class="info-box" id="imageInfo" style="display:none;">
        <strong>Image Size:</strong> <span id="imageSize"></span>
      </div>
      <img id="imagePreview" class="image-preview" alt="Shop Image Preview" />

      <!-- Second image: Owner Image -->
      <label for="ownerImage">Owner Image</label>
      <input type="file" name="ownerImage" id="ownerImage" accept="image/*" required>

      <div class="info-box" id="ownerImageInfo" style="display:none;">
        <strong>Image Size:</strong> <span id="ownerImageSize"></span>
      </div>
      <img id="ownerImagePreview" class="image-preview" alt="Owner Image Preview" />

      <label for="category">Category</label>
      <select id="category" name="shopType">
          <option value="Grocery">Grocery</option>
          <option value="Fish">Fish</option>
          <option value="General Store">General Store</option>
      </select>

      <label for="market">Market</label>
      <select name="marketName" id="marketName">
        <option value="New-Market">New Market</option>
        <option value="Ballygunge-Market">Ballygunge Market</option>
      </select>
<br>
<br>
      <button type="submit" class="submit-btn">Submit</button>
    </form>
  </main>

  <footer>
    &copy; 2025 Gigamart | VikshitBharat Initiative
  </footer>

  <script>
    // First image preview logic
    const shopImageInput = document.getElementById('shopImage');
    const imagePreview = document.getElementById('imagePreview');
    const imageInfo = document.getElementById('imageInfo');
    const imageSizeDisplay = document.getElementById('imageSize');

    shopImageInput.addEventListener('change', function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          imagePreview.src = e.target.result;
          imagePreview.style.display = 'block';
        };
        reader.readAsDataURL(file);
        const sizeKB = (file.size / 1024).toFixed(2);
        imageSizeDisplay.textContent = `${sizeKB} KB`;
        imageInfo.style.display = 'block';
      } else {
        imagePreview.style.display = 'none';
        imageInfo.style.display = 'none';
      }
    });

    // Second image preview logic
    const ownerImageInput = document.getElementById('ownerImage');
    const ownerImagePreview = document.getElementById('ownerImagePreview');
    const ownerImageInfo = document.getElementById('ownerImageInfo');
    const ownerImageSize = document.getElementById('ownerImageSize');

    ownerImageInput.addEventListener('change', function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          ownerImagePreview.src = e.target.result;
          ownerImagePreview.style.display = 'block';
        };
        reader.readAsDataURL(file);
        const sizeKB = (file.size / 1024).toFixed(2);
        ownerImageSize.textContent = `${sizeKB} KB`;
        ownerImageInfo.style.display = 'block';
      } else {
        ownerImagePreview.style.display = 'none';
        ownerImageInfo.style.display = 'none';
      }
    });
  </script>
</body>
</html>
